# Local infrastructure (Blueprint §3, docs/07-ops/01-local-dev-setup.md).
# Services: Postgres 16 + pgvector, MinIO (S3), Mailpit (SMTP), ML service.
# The web app and worker run on the host via `pnpm dev` / `pnpm dev:worker`.
#
# NOTE: the `ml` service builds from ./docker/ml.Dockerfile, which is created in M5.
# Until then, either comment out the `ml` service or run the ML service separately.
name: temuunair

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: temuunair
      POSTGRES_PASSWORD: temuunair
      POSTGRES_DB: temuunair
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temuunair"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the dev bucket on first start
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/temuunair-dev;
      echo 'bucket ready';
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Uncomment after M5 creates the Dockerfile
  # ml:
  #   build:
  #     context: ..
  #     dockerfile: infra/docker/ml.Dockerfile
  #   environment:
  #     ML_SERVICE_TOKEN: dev-ml-token
  #     ML_MODE: stub
  #   ports:
  #     - "8000:8000"

volumes:
  postgres-data:
  minio-data:
