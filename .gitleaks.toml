# gitleaks configuration (docs/05-workflow/12-secrets-and-env-handling.md).
# The repo is documentation-first, so a few well-known dev-only placeholder values appear in
# examples. Everything else must be caught.
title = "TemuUNAIR"

[extend]
useDefault = true

[allowlist]
description = "Dev-only placeholder values and documented non-secret identifiers in examples, docs and config"
paths = [
  '''\.env\.example$''',
  '''^docs/04-contracts/backend/BE-11-env-config-contract\.md$''',
  '''^docs/05-workflow/12-secrets-and-env-handling\.md$''',
  '''^tests/fixtures/''',
  '''^services/ml/models\.lock\.json$''',
  '''^docs/00-BLUEPRINT\.md$''',
  '''^\.github/workflows/ci\.yml$''',
  '''^infra/docker-compose\.yml$''',
  '''^infra/docker/''',
  '''^\.gitleaks\.toml$''',
]
regexes = [
  '''dev-only-change-me''',
  '''dev-google-client-id''',
  '''dev-google-client-secret''',
  '''dev-ml-token''',
  '''dev-only-32byte-key-change-me''',
  '''minioadmin''',
  '''no-reply@temuunair\.local''',
  # generic-api-key false positives: env-var *reference* (apps/worker/src/config.ts:41
  # captures `env.S3_SECRET_KEY` before the `?? "minioadmin"` default) and
  # GitHub Security Advisory IDs quoted in review docs (identifiers, not secrets).
  '''env\.S3_SECRET_KEY''',
  '''GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}''',
]
