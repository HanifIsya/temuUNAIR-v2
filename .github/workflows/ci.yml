# CI (Blueprint §7.10). All jobs required on main except audit/docker-build (initially advisory).
# Gate parity note: 'lane check' is local-only in scripts/gate.sh (enforces branch naming/worktree boundaries for agents); GitHub CI scans all PR files.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # pnpm is pinned by `packageManager` in the root package.json, which pnpm/action-setup@v4
  # reads automatically. Setting `version:` on the action as well makes it fail with
  # "Multiple versions of pnpm specified", so the version lives in exactly one place.

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s format:check
      - run: pnpm -s lint
      - run: pnpm -s typecheck
      - run: pnpm -s i18n:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s build

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s test:unit

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s contracts:check
      - run: pnpm -s contracts:lint
      - run: pnpm -s contracts:breaking

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: temuunair
          POSTGRES_PASSWORD: temuunair
          POSTGRES_DB: temuunair_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U temuunair" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s db:check
        env:
          DATABASE_URL: postgres://temuunair:temuunair@localhost:5432/temuunair_test

  ml:
    runs-on: ubuntu-latest
    steps:
      # services/ml is built in TMU-OPS-006. Until its pyproject.toml exists there is nothing to
      # sync, lint or test, so the job reports a skip instead of a red build. Mirrors the
      # `-f services/ml/pyproject.toml` guard in scripts/gate.sh.
      - uses: actions/checkout@v4
      - id: present
        run: echo "exists=$([ -f services/ml/pyproject.toml ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.exists == 'yes'
        uses: astral-sh/setup-uv@v4
      - if: steps.present.outputs.exists == 'yes'
        run: uv sync --frozen
        working-directory: services/ml
      - if: steps.present.outputs.exists == 'yes'
        run: uv run ruff check .
        working-directory: services/ml
      - if: steps.present.outputs.exists == 'yes'
        run: uv run pytest -q -m "not slow"
        working-directory: services/ml
      - if: steps.present.outputs.exists == 'no'
        run: echo "services/ml not implemented yet (TMU-OPS-006) — skipping"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s test:integration

  contract-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s test:contract

  e2e:
    runs-on: ubuntu-latest
    env:
      ML_MODE: stub
    steps:
      # The guard is tests/e2e/package.json (TMU-OPS-013): the job skips until the scenarios
      # package exists rather than reporting a red build for work that has not landed yet. The old
      # apps/web guard (TMU-OPS-003) flipped the job on before a shell or scenarios could run, and
      # Playwright installs through @temuunair/e2e-tests (TMU-OPS-017) because the workspace root
      # has no `playwright` dependency, so a root `pnpm exec playwright` cannot resolve the binary.
      - uses: actions/checkout@v4
      - id: present
        run: echo "exists=$([ -f tests/e2e/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.exists == 'yes'
        uses: pnpm/action-setup@v6
      - if: steps.present.outputs.exists == 'yes'
        uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - if: steps.present.outputs.exists == 'yes'
        run: pnpm install --frozen-lockfile
      - if: steps.present.outputs.exists == 'yes'
        run: pnpm --filter @temuunair/e2e-tests exec playwright install --with-deps chromium
      - if: steps.present.outputs.exists == 'yes'
        run: pnpm -s test:e2e
      - if: steps.present.outputs.exists == 'no'
        run: echo "tests/e2e not implemented yet (TMU-OPS-013) — skipping"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory at first (Blueprint §7.10)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s run audit

  docker-build:
    # Catches Dockerfile drift on main (Blueprint §7.10, docs/05-workflow/08-ci-cd.md).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/web.Dockerfile .
